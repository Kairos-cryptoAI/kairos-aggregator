[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-aggregator"
version = "0.1.0"
description = "Kairos Layer 3 — tactical decision brain (medium/high reasoning)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "kairos-core>=0.2,<0.3",
    "kairos-llm>=0.1,<0.2",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "redis>=6.4,<9",
    "structlog>=24.1,<27",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "c2b9ba192521f9843b245e1eae8a501d408a6bfa" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "c6a8ff3902abc5df4ca95dbf3c72b114a086111a" }

[project.scripts]
kairos-aggregator = "kairos_aggregator.service:main"

[tool.hatch.build.targets.wheel]
packages = ["kairos_aggregator"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
