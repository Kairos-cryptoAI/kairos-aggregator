[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-aggregator"
version = "0.2.0"
description = "Kairos Layer 3 — immutable candidate review and legacy tactical aggregation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "kairos-core>=0.3,<0.4",
    "kairos-llm>=0.1,<0.2",
    "kairos-persistence>=0.1,<0.2",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "redis>=6.4,<9",
    "structlog>=24.1,<27",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "2b3b0d5b3966eebc8a8f59a8557dd1cc505a933d" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "54ef1176720a1e078c947d8217468b3c66f07382" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "3ff23687bf559be84b318e47588b61f8cf4e0ece" }

[project.scripts]
kairos-aggregator = "kairos_aggregator.service:main"
kairos-candidate-review = "kairos_aggregator.candidate_service:main"
kairos-candidate-qualify = "kairos_aggregator.shadow_qualification:main"

[tool.hatch.build.targets.wheel]
packages = ["kairos_aggregator"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
